// JugglucoNG-RUS: build type `rus`, added from outside the upstream build files.
//
// Run every build through rus/gradlew-rus.sh, which passes `-I rus/rus-init.gradle`.
// Upstream Common/build.gradle stays untouched (rule: easy upstream merges, see rus/HOOKS.md).
//
// What this script does, all for the `rus` build type only:
//  - creates `rus` from upstream `release` (initWith), then adds exactly our changes:
//    package suffix .rus, version suffix -rusN, own versionCode, own update repo,
//    no SourceForge fallback, -DAPPSUFFIX for the native side, our R8 rules rus/proguard-rus.pro;
//  - fails the build loudly if `rus` no longer matches `release` apart from those changes
//    (upstream added a flag to `release` that initWith did not copy, etc.);
//  - fails the build if any of the four signing properties is missing or empty,
//    so a `rus` APK can never silently fall back to upstream's public everyone.keystore.
//
// Release number N: -PrusRelease=N (0 = test build, 1..99 = published releases).

final String RUS_TYPE = 'rus'
final String RUS_SUFFIX = '.rus'
final String RUS_REPO = 'lbarmen/JugglucoNG-RUS'

gradle.beforeProject { Project p ->
    if (p.path != ':Common') return

    def relRaw = (p.findProperty('rusRelease') ?: '0').toString().trim()
    if (!(relRaw ==~ /\d{1,2}/)) {
        throw new GradleException("RUS: -PrusRelease must be 0..99, got '$relRaw'")
    }
    final int rusRelease = relRaw.toInteger()

    p.pluginManager.withPlugin('com.android.application') {
        def comps = p.extensions.getByName('androidComponents')

        comps.finalizeDsl { android ->
            def release = android.buildTypes.getByName('release')
            def rus = android.buildTypes.create(RUS_TYPE)
            rus.initWith(release)

            rus.applicationIdSuffix = RUS_SUFFIX
            rus.versionNameSuffix = "-rus${rusRelease}"
            rus.buildConfigField 'String', 'UPDATE_REPO', "\"${RUS_REPO}\""
            rus.buildConfigField 'String', 'UPDATE_BACKUP_SOURCE', '""'
            rus.buildConfigField 'int', 'RUS_RELEASE', "${rusRelease}"
            // Our R8 rules after upstream's (rus/proguard-rus.pro: constructors of classes inflated from XML).
            final String RUS_PROGUARD = 'proguard-rus.pro'
            rus.proguardFile(p.rootProject.file("rus/${RUS_PROGUARD}"))
            def appSuffixFlag = "-DAPPSUFFIX=\"quotes(${RUS_SUFFIX})\""
            rus.externalNativeBuild.cmake.cppFlags.add(appSuffixFlag)
            rus.externalNativeBuild.cmake.cFlags.add(appSuffixFlag)

            // ---- inheritance check: rus == release + our additions, nothing else ----
            def problems = []
            def same = { String what, a, b ->
                if (a != b) problems << "$what: release=$a rus=$b"
            }
            same('signingConfig', release.signingConfig?.name, rus.signingConfig?.name)
            same('minifyEnabled', release.minifyEnabled, rus.minifyEnabled)
            same('shrinkResources', release.shrinkResources, rus.shrinkResources)
            same('debuggable', release.debuggable, rus.debuggable)
            same('jniDebuggable', release.jniDebuggable, rus.jniDebuggable)
            same('proguardFiles', release.proguardFiles*.name + [RUS_PROGUARD], rus.proguardFiles*.name)
            same('consumerProguardFiles', release.consumerProguardFiles*.name, rus.consumerProguardFiles*.name)
            same('manifestPlaceholders', release.manifestPlaceholders, rus.manifestPlaceholders)
            same('matchingFallbacks', release.matchingFallbacks, rus.matchingFallbacks)

            def fieldMap = { bt ->
                bt.buildConfigFields.collectEntries { k, v -> [(k): "${v.type} ${v.value}".toString()] }
            }
            def ours = ['UPDATE_REPO', 'UPDATE_BACKUP_SOURCE', 'RUS_RELEASE'] as Set
            def relFields = fieldMap(release).findAll { k, v -> !(k in ours) }
            def rusFields = fieldMap(rus).findAll { k, v -> !(k in ours) }
            same('buildConfigFields', relFields, rusFields)
            if (release.buildConfigFields.keySet().any { it in ours }) {
                problems << "upstream release now sets one of our buildConfigFields ${ours}: review rus-init.gradle"
            }
            def resMap = { bt ->
                bt.resValues.collectEntries { k, v -> [(k): "${v.type} ${v.value}".toString()] }
            }
            same('resValues', resMap(release), resMap(rus))

            def relCmake = release.externalNativeBuild.cmake
            def rusCmake = rus.externalNativeBuild.cmake
            same('cmake.cppFlags', relCmake.cppFlags + [appSuffixFlag], rusCmake.cppFlags)
            same('cmake.cFlags', relCmake.cFlags + [appSuffixFlag], rusCmake.cFlags)
            same('cmake.arguments', relCmake.arguments, rusCmake.arguments)
            same('cmake.abiFilters', relCmake.abiFilters, rusCmake.abiFilters)
            same('cmake.targets', relCmake.targets, rusCmake.targets)
            same('ndk.abiFilters', release.ndk.abiFilters, rus.ndk.abiFilters)
            same('ndk.debugSymbolLevel', release.ndk.debugSymbolLevel, rus.ndk.debugSymbolLevel)

            // Upstream release must not grow suffixes of its own that we would silently inherit.
            if (release.applicationIdSuffix) problems << "upstream release has applicationIdSuffix '${release.applicationIdSuffix}'"
            if (release.versionNameSuffix) problems << "upstream release has versionNameSuffix '${release.versionNameSuffix}'"
            if (!relCmake.cppFlags.any { it.contains('-DRELEASEDIR=1') }) problems << 'upstream release no longer passes -DRELEASEDIR=1'
            // Sources/resources that only `release` sees would be missing from `rus` without any error.
            ['src/release', 'src/mobileRelease', 'src/wearRelease'].each { dir ->
                if (p.file(dir).exists()) problems << "upstream now has ${dir}/ (release-only sources): rus would not get them"
            }

            if (problems) {
                throw new GradleException("RUS: build type 'rus' no longer matches upstream 'release':\n  - " +
                        problems.join('\n  - ') + "\nFix rus/rus-init.gradle (copy the value explicitly), do not edit Common/build.gradle.")
            }
            p.logger.lifecycle("RUS: build type 'rus' = upstream 'release' + .rus / -rus${rusRelease} / ${RUS_REPO} (inheritance check passed)")
        }

        // Own versionCode: upstream code * 100 + N (1032 -> 103200 + N); wear keeps upstream's +1 000 000.
        comps.onVariants(comps.selector().withBuildType(RUS_TYPE)) { variant ->
            int upstreamCode = (p.property('appVersionCode') as Integer)
            boolean isWear = variant.productFlavors.any { it.second == 'wear' }
            int code = upstreamCode * 100 + rusRelease + (isWear ? 1000000 : 0)
            variant.outputs.each { out -> out.versionCode.set(code) }
        }
    }

    // Signing guard: any rus task in the graph needs all four signing properties and an existing key file.
    p.gradle.taskGraph.whenReady { graph ->
        boolean rusRequested = graph.allTasks.any { t -> t.project == p && t.name.contains('Rus') }
        if (!rusRequested) return
        def missing = ['thekeyfile', 'thepassword', 'thekeyalias', 'thekeypassword'].findAll { name ->
            !p.hasProperty(name) || p.property(name).toString().isEmpty()
        }
        if (missing) {
            throw new GradleException("RUS: signing property missing or empty: ${missing.join(', ')}. " +
                    "A rus build is never signed with upstream's everyone.keystore.")
        }
        def keyFile = p.file(p.property('thekeyfile').toString())
        if (!keyFile.isFile()) {
            throw new GradleException("RUS: signing key file does not exist: thekeyfile (path resolved from Common/)")
        }
        if (keyFile.canonicalFile == p.file('everyone.keystore').canonicalFile) {
            throw new GradleException("RUS: thekeyfile points to upstream's everyone.keystore")
        }
    }
}
