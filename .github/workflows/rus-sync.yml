# JugglucoNG-RUS: daily check of upstream releases (plan of stage 2, block B; ТЗ 3.4). No secrets, no environment,
# read-only token, nothing is pushed: main gets a release only through a PR sync/<release> opened from the computer.
#
# schedule (08:30 UTC)  latest upstream release (not a draft, not a pre-release; nightly-* are pre-releases):
#                       already in main -> green, short; RUS_SYNC_SKIP=<tag> -> green, silent; already verified
#                       for this main (artifact verified-<tag>-<main>) -> only the reminder; otherwise the full
#                       check, then the reminder "Выпуск X ждёт вливания" stays red (that is the e-mail) until
#                       the release is in main.
# workflow_dispatch     always the full check: point = their release/commit (default: latest release),
#                       base = our branch (default main), mode merge | overlay (release tree + our files, for the
#                       run over past releases).
# pull_request -> main  the full check of the PR tree as it is (no new merge); report main -> PR.
# Jobs: check -> merge (merge in the job, report, hooks/budget/secrets) -> build (one-time key, phone + wear,
# check-apk --mode test, schema export) + tests (their JVM suites with our golden runs, guardrails, Python tests)
# -> report (red if anything is red or skipped) -> remind (schedule only). No Gradle cache on purpose.
name: RUS sync
run-name: >-
  ${{ github.event_name == 'pull_request' && format('RUS sync PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'schedule' && 'RUS sync (утро)' ||
  format('RUS sync {0} на {1} ({2})', inputs.point || 'последний выпуск', inputs.base || 'main', inputs.mode || 'merge') }}

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      point:
        description: 'their release tag or commit (empty = latest release without pre-release mark)'
        required: false
        default: ''
      base:
        description: 'our branch to merge into (default main)'
        required: false
        default: 'main'
      mode:
        description: 'merge = base + their point; overlay = their point + our files from base'
        required: false
        default: 'merge'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # manual runs: one group per base + point + mode, so two different manual runs never cancel each other
  group: rus-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.base }}-${{ inputs.point }}-${{ inputs.mode }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM: https://github.com/ctqvva/JugglucoNG.git

jobs:
  check:
    name: check (which release, already in main?)
    if: github.repository == 'lbarmen/JugglucoNG-RUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.c.outputs.mode }}
      kind: ${{ steps.c.outputs.kind }}
      tag: ${{ steps.c.outputs.tag }}
      point: ${{ steps.c.outputs.point }}
      base: ${{ steps.c.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base || '' }}

      - id: c
        name: Pick their point and decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          POINT_IN: ${{ inputs.point }}
          MODE_IN: ${{ inputs.mode }}
          SKIP: ${{ vars.RUS_SYNC_SKIP }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags -q upstream main
          base=$(git rev-parse HEAD)
          latest=$(gh api "repos/ctqvva/JugglucoNG/releases?per_page=50" --jq \
            '[.[] | select(.draft | not) | select(.prerelease | not)] | sort_by(.published_at) | last | .tag_name')
          [ -n "$latest" ] && [ "$latest" != null ] || { echo "::error::no upstream release found (API)"; exit 1; }
          kind=merge
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="${POINT_IN:-$latest}"
            case "${MODE_IN:-merge}" in merge|overlay) kind="${MODE_IN:-merge}";; *) echo "::error::mode '$MODE_IN' is not merge or overlay"; exit 1;; esac
          elif [ "$EVENT" = pull_request ]; then
            tag=""; kind=pr
          else
            tag="$latest"
          fi
          point=""
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::point '$tag' has odd characters"; exit 1; }
            if git fetch --no-tags -q upstream "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
              point=$(git rev-parse "refs/tags/$tag^{commit}")
            else
              git fetch --no-tags -q upstream "$tag" || { echo "::error::'$tag' is neither their tag nor their commit"; exit 1; }
              point=$(git rev-parse FETCH_HEAD)
            fi
          fi
          mode=full
          if [ "$EVENT" = schedule ]; then
            if git merge-base --is-ancestor "$point" "$base"; then
              mode=skip; echo "Их последний выпуск **$tag** уже в \`main\`: проверять нечего." >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$SKIP" ] && [ "$SKIP" = "$tag" ]; then
              mode=skip; echo "Выпуск **$tag** пропущен по слову владельца (RUS_SYNC_SKIP)." >> "$GITHUB_STEP_SUMMARY"
            else
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-$tag-${base:0:9}&per_page=10" \
                --jq '[.artifacts[] | select(.expired | not)] | length')
              if [ "$n" -gt 0 ]; then
                mode=remind; echo "Выпуск **$tag** уже проверен на \`main\` ${base:0:9}: только напоминание." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "event=$EVENT kind=$kind mode=$mode tag=${tag:-none} point=${point:-none} base=$base"
          { echo "mode=$mode"; echo "kind=$kind"; echo "tag=$tag"; echo "point=$point"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

  merge:
    name: merge (in the job), report, hooks, budget, secrets
    needs: check
    if: needs.check.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - name: Fetch upstream (main, tags, their point)
        env:
          POINT: ${{ needs.check.outputs.point }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch -q upstream main '+refs/tags/*:refs/tags/*'
          [ -z "$POINT" ] || git cat-file -e "$POINT^{commit}" 2>/dev/null || git fetch -q upstream "$POINT"

      - id: m
        name: Report and merge
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.check.outputs.kind }}
          TAG: ${{ needs.check.outputs.tag }}
          POINT: ${{ needs.check.outputs.point }}
          BASE: ${{ needs.check.outputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          git config user.name rus-sync
          git config user.email rus-sync@users.noreply.github.com
          case "$KIND" in
            pr)
              old=$(git merge-base "$PR_BASE" upstream/main); new=$(git merge-base HEAD upstream/main)
              echo "PR: their code main ${old:0:9} -> PR ${new:0:9}" ;;
            merge)
              old=$(git merge-base "$BASE" upstream/main); new="$POINT" ;;
            overlay)
              old="$POINT"; new="$POINT" ;;
          esac
          if [ "$KIND" = overlay ]; then
            echo "Режим overlay: дерево их выпуска $TAG плюс наши файлы; отчёт по диапазону не строится." > out/sync-report.md
            echo '{}' > out/sync-report.json
          else
            python3 rus/sync-report.py "$old" "$new" --ours "$BASE" --out out/sync-report.md --json out/sync-report.json
          fi
          status=0
          if [ "$KIND" = merge ]; then
            if ! git merge --no-ff --no-edit -m "RUS sync: merge their ${TAG} into ${BASE:0:9} (in the job, not pushed)" "$POINT" > out/merge.txt 2>&1; then
              cat out/merge.txt
              { echo "КОНФЛИКТ при слиянии с $TAG:"; git diff --name-only --diff-filter=U | sed 's/^/- /'; } | tee out/conflict.txt
              echo "::error::merge conflict with $TAG: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort
              exit 1
            fi
          elif [ "$KIND" = overlay ]; then
            git ls-tree -r --name-only HEAD | python3 -c "import sys; sys.path.insert(0, 'rus'); import rus_common as rc; print('\n'.join(p for p in sys.stdin.read().split('\n') if p and rc.is_ours(p)))" > "$RUNNER_TEMP/ours.txt"
            git checkout -q --detach "$POINT"
            git checkout "$BASE" --pathspec-from-file="$RUNNER_TEMP/ours.txt"
            git commit -q -m "RUS sync overlay: their ${TAG} + our files from ${BASE:0:9}"
          fi
          git branch -f rus-sync-merged HEAD
          git rev-parse HEAD > out/merged.sha
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create out/merged.bundle "$BASE..rus-sync-merged"
          fi
          # their code in the checked tree: for the hooks budget and "our commits only" (base may already hold
          # their code newer than the point, e.g. main on unreleased upstream code before the first sync)
          if [ "$KIND" = overlay ]; then theirs="$POINT"; else theirs=$(git merge-base HEAD upstream/main); fi
          echo "theirs=$theirs" >> "$GITHUB_OUTPUT"
          echo "their code in the tree: ${theirs:0:9}"
          echo "Дерево проверки: $(git log --oneline -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Hooks registry, budget, secrets in our commits, golden scenarios unchanged
        env:
          THEIRS: ${{ steps.m.outputs.theirs }}
        run: |
          set -uo pipefail
          fail=0
          { python3 rus/check-hooks.py --ref HEAD --base "$THEIRS" || fail=1
            bash rus/check-secrets.sh --ours "$THEIRS" || fail=1
            python3 rus/golden/scenarios.py --check || fail=1
          } 2>&1 | tee out/checks.txt
          grep -q '^FAIL' out/checks.txt && fail=1
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-merge
          path: out/
          if-no-files-found: warn
          retention-days: 1

  build:
    name: build rus phone + wear (one-time key), checks, schema export
    needs: [check, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync-merge

      - name: The tree the merge job checked
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/sync-merge"
          if [ -f "$m/merged.bundle" ]; then
            git fetch -q "$m/merged.bundle" rus-sync-merged:rus-sync-merged
            git checkout -q rus-sync-merged
          fi
          [ "$(git rev-parse HEAD)" = "$(cat "$m/merged.sha")" ] || { echo "::error::tree differs from the merge job"; exit 1; }
          git log --oneline -1

      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the "upstream files untouched" check)
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags -q upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      - name: Build rus phone + wear with a one-time signing key
        run: |
          set -euo pipefail
          umask 077
          kdir=$(mktemp -d "$RUNNER_TEMP/rus-onetime.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$kdir/onetime.p12" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias onetime -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JugglucoNG-RUS one-time test key" > /dev/null 2>&1
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/onetime.p12"
          export ORG_GRADLE_PROJECT_thepassword="$pw"
          export ORG_GRADLE_PROJECT_thekeyalias=onetime
          export ORG_GRADLE_PROJECT_thekeypassword="$pw"
          start=$(date +%s)
          bash rus/gradlew-rus.sh :Common:assembleMobileRus -PrusRelease=0 --no-daemon --no-configuration-cache --stacktrace
          bash rus/gradlew-rus.sh :Common:assembleWearRus -PrusRelease=0 --no-daemon --no-configuration-cache --stacktrace
          echo "gradle: $(( ($(date +%s) - start) / 60 )) min" | tee build-time.txt

      - name: Checks on the APKs and the schema export
        run: |
          set -euo pipefail
          phone=$(ls Common/build/outputs/apk/mobile/rus/*.apk)
          wear=$(ls Common/build/outputs/apk/wear/rus/*.apk)
          fail=0
          python3 rus/check-apk.py --phone "$phone" --wear "$wear" --release 0 --mode test > rus-checks.txt 2>&1 || fail=1
          if [ -n "$(git status --porcelain Common/schemas)" ]; then
            { echo "FAIL  Common/schemas changed during the build: their schema export is not committed"
              git status --porcelain Common/schemas; } >> rus-checks.txt
            fail=1
          else
            echo "OK    Common/schemas: the build regenerated nothing (their schema export is committed)" >> rus-checks.txt
          fi
          cat rus-checks.txt
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-build
          path: |
            Common/build/outputs/apk/mobile/rus/*.apk
            Common/build/outputs/apk/wear/rus/*.apk
            rus-checks.txt
            build-time.txt
          if-no-files-found: warn
          retention-days: 7

  tests:
    name: tests (their JVM suites + our golden runs, guardrails, Python tests)
    needs: [check, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.check.outputs.base || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sync-merge
          path: ${{ runner.temp }}/sync-merge

      - name: The tree the merge job checked
        run: |
          set -euo pipefail
          m="$RUNNER_TEMP/sync-merge"
          if [ -f "$m/merged.bundle" ]; then
            git fetch -q "$m/merged.bundle" rus-sync-merged:rus-sync-merged
            git checkout -q rus-sync-merged
          fi
          [ "$(git rev-parse HEAD)" = "$(cat "$m/merged.sha")" ] || { echo "::error::tree differs from the merge job"; exit 1; }
          git submodule update --init --recursive || {
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      # Their ci.yml jobs distribution-contract and ui-guardrails, step by step, without
      # `scripts/update-build-inputs.sh --ci` (it needs their official repository). When their ci.yml changes
      # (sync report, section 10), compare this list with it.
      - name: Their tests
        run: |
          set -uo pipefail
          mkdir -p out/logs
          fail=0; i=0
          t() {
            i=$((i + 1)); local name="$1"; shift; local s=$(date +%s)
            if "$@" > "out/logs/$i.txt" 2>&1; then r="зелёное"; else r="**красное** (лог out/logs/$i.txt)"; fail=1; fi
            echo "| $name | $r | $(( $(date +%s) - s )) с |" | tee -a out/tests.md
          }
          echo "| проверка | итог | время |" > out/tests.md
          echo "|---|---|---|" >> out/tests.md
          t "JVM: телефон и часы, с нашими эталонами (testMobileDebugUnitTest, testWearDebugUnitTest)" \
            ./gradlew :Common:testMobileDebugUnitTest :Common:testWearDebugUnitTest --continue --no-daemon --stacktrace
          t "UI guardrails" python3 scripts/ui-guardrails.py
          t "UI guardrails: тесты" python3 -m unittest discover -s scripts/tests -v
          # without GITHUB_REPOSITORY, as on a developer's computer: test_readme_downloads expects their name or none
          t "Distribution: scripts/dist/tests" env -u GITHUB_REPOSITORY python3 -m unittest discover -s scripts/dist/tests -v
          t "Clone через TURN" python3 tools/test-clone-turn.py --streams
          t "TURN TLS и потоки" python3 tools/test-turn-stream.py
          t "HTTPS-ответы токена" python3 tools/test-context-https.py
          t "Rendezvous failover" python3 tools/test-rendezvous-failover.py
          t "Калибровка зеркала" python3 tools/test-mirror-calibration.py
          t "Калибровка зеркала: возврат" python3 tools/test-mirror-calibration-return.py
          t "Сохранённые показания" python3 tools/test-resolved-glucose.py
          t "Nightscout: отправка не мешает свежим показаниям" python3 tools/test-nightscout-backlog.py
          t "Nightscout: выбор данных через JNI" python3 tools/test-nightscout-export-mode.py
          for f in Common/build/test-results/*/TEST-*.xml; do [ -f "$f" ] || continue
            python3 - "$f" >> out/junit.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          print(r.get('name'), r.get('tests'), r.get('failures'), r.get('errors'), r.get('skipped'), r.get('time'))
          PY
          done
          if [ -f out/junit.txt ]; then
            awk '{n+=$2; f+=$3+$4; s+=$5} END {printf "JVM-тесты: %d, упало %d, пропущено %d\n", n, f, s}' out/junit.txt | tee out/junit-summary.txt
            grep -E '^rus\.' out/junit.txt | tee out/ours.txt || echo "НАШИ ТЕСТЫ НЕ ЗАПУСКАЛИСЬ" | tee out/ours.txt
          fi
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sync-tests
          path: |
            out/
            Common/build/rus-golden/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: sync-test-reports
          path: |
            Common/build/reports/tests/
            Common/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: report
    needs: [check, merge, build, tests]
    if: always() && github.repository == 'lbarmen/JugglucoNG-RUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.check.outputs.mode == 'full'
        continue-on-error: true
        with:
          pattern: sync-*
          path: parts

      - name: Report page and verdict
        env:
          MODE: ${{ needs.check.outputs.mode }}
          KIND: ${{ needs.check.outputs.kind }}
          TAG: ${{ needs.check.outputs.tag }}
          BASE: ${{ needs.check.outputs.base }}
          R_CHECK: ${{ needs.check.result }}
          R_MERGE: ${{ needs.merge.result }}
          R_BUILD: ${{ needs.build.result }}
          R_TESTS: ${{ needs.tests.result }}
        run: |
          # no -e here: a missing part must not stop the page; the verdict is computed explicitly below
          set +e -u
          word() { case "$1" in success) echo "зелёное";; skipped) echo "**пропущено**";; cancelled) echo "**отменено**";; *) echo "**красное**";; esac; }
          if [ "$R_CHECK" != success ]; then
            echo "Задание check: $(word "$R_CHECK")" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$MODE" = skip ] || [ "$MODE" = remind ]; then
            echo "Полная проверка не нужна (mode=$MODE)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          p=parts
          {
            echo "# RUS sync: ${TAG:-PR} — ${KIND}"
            echo
            echo "| задание | итог |"
            echo "|---|---|"
            echo "| merge: слияние, отчёт, врезки, бюджет, секреты | $(word "$R_MERGE") |"
            echo "| build: сборка rus, проверки APK, схемы БД | $(word "$R_BUILD") |"
            echo "| tests: их тесты и наши эталоны | $(word "$R_TESTS") |"
            echo
            [ -f $p/sync-merge/conflict.txt ] && { cat $p/sync-merge/conflict.txt; echo; }
            if [ -f $p/sync-merge/checks.txt ]; then echo '### Проверки врезок, бюджета, секретов'; echo '```'; cat $p/sync-merge/checks.txt; echo '```'; fi
            if [ -f $p/sync-build/rus-checks.txt ]; then echo '### Проверки APK'; echo '```'; cat $p/sync-build/rus-checks.txt; echo '```'; fi
            [ -f $p/sync-build/build-time.txt ] && cat $p/sync-build/build-time.txt
            if [ -f $p/sync-tests/out/tests.md ]; then echo; echo '### Тесты'; cat $p/sync-tests/out/tests.md; fi
            [ -f $p/sync-tests/out/junit-summary.txt ] && { echo; cat $p/sync-tests/out/junit-summary.txt; }
            if [ -f $p/sync-tests/out/ours.txt ]; then echo; echo 'Наши тесты (класс, тестов, упало, ошибок, пропущено, с):'; echo '```'; cat $p/sync-tests/out/ours.txt; echo '```'; fi
            g=""; for c in $p/sync-tests/Common/build/rus-golden/diff.md $p/sync-tests/rus-golden/diff.md; do [ -f "$c" ] && { g="$c"; break; }; done
            if [ -n "$g" ]; then echo; sed 's/^# /### /' "$g"; else echo; echo '### Эталоны тревог и прогноза'; echo '**результата нет** (тесты не дошли до них)'; fi
            echo
            [ -f $p/sync-merge/sync-report.md ] && sed 's/^# /## /' $p/sync-merge/sync-report.md
            true
          } > sync-report.md
          cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
          ok=1
          for r in "$R_MERGE" "$R_BUILD" "$R_TESTS"; do [ "$r" = success ] || ok=0; done
          if [ $ok = 1 ] && [ "$KIND" = merge ] && [ -n "$TAG" ]; then
            echo "verified $TAG on ${BASE}" > verified.txt
            echo "marker=verified-$TAG-${BASE:0:9}" >> "$GITHUB_ENV"
          fi
          echo "ok=$ok" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && needs.check.outputs.mode == 'full'
        with:
          name: sync-report
          path: sync-report.md
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.marker != ''
        with:
          name: ${{ env.marker }}
          path: verified.txt
          retention-days: 90

      - name: Verdict
        if: needs.check.outputs.mode == 'full'
        run: |
          [ "$ok" = 1 ] || { echo "::error::something is red or skipped - see the report on this page"; exit 1; }
          echo "all green"

  remind:
    name: ${{ format('Выпуск {0} ждёт вливания', needs.check.outputs.tag) }}
    needs: [check, report]
    if: always() && github.event_name == 'schedule' && needs.check.outputs.mode != 'skip' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "::error::Их выпуск $TAG проверен и ждёт вливания в main: открой чат и напиши «продолжи нитку вливание»."
          exit 1

  mail-probe:
    name: Проба письма (RUS_SYNC_TEST_FAIL=1)
    if: github.event_name == 'schedule' && vars.RUS_SYNC_TEST_FAIL == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::Нарочно красное задание: проверка, что письмо о красном утреннем запуске приходит. Переменную RUS_SYNC_TEST_FAIL удалит чат."
          exit 1
