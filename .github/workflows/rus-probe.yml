# JugglucoNG-RUS: TEMPORARY probe for plan of stage 2, B3 (removed right after). Runs only our code.
# 1) can the job token push a branch that changes a workflow file? (fact 5: expected "refused")
# 2) can it push a plain branch? (control)
name: RUS probe (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rus-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  token-push:
    if: github.repository == 'lbarmen/JugglucoNG-RUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          set -u
          git config user.name rus-probe
          git config user.email rus-probe@users.noreply.github.com
          git checkout -q -b test/probe-token-workflow
          echo "# probe" >> .github/workflows/rus-probe.yml
          git commit -qam "probe: workflow file change pushed with the job token"
          git push origin test/probe-token-workflow > push1.txt 2>&1; r1=$?
          cat push1.txt
          git checkout -q -b test/probe-token-plain HEAD~1
          echo probe > rus-probe.txt
          git add rus-probe.txt
          git commit -qm "probe: plain change pushed with the job token"
          git push origin test/probe-token-plain > push2.txt 2>&1; r2=$?
          cat push2.txt
          echo "RESULT workflow-change push exit=$r1; plain push exit=$r2" | tee -a "$GITHUB_STEP_SUMMARY"
