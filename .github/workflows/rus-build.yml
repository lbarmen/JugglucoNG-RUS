# JugglucoNG-RUS: build of build type `rus` (phone + wear) and checks on the APKs.
#
# test-build (push to main or feature/**, not a push of .md files only; or Run workflow with release 0):
#   no environment, no secrets. Signed with a one-time key the job creates and deletes itself; release number 0
#   (versionName ...-rus0). Its APKs are for checks and the emulator only, never for a phone or a
#   watch: Android would not install the next build over it.
#
# Candidate (Run workflow on main with release 1..99 and the block branches to test, space-separated,
# may be empty): main + those branches merged in this run, signed with our key; the APKs stay on the
# run page (artifact, 14 days) and are installed by hand. No GitHub release: owner's decision
# 15.11.2026 - a block goes to main only after it was tested on the phone, each block on its own.
#   candidate-precheck  no secrets: inputs, release N above every rus-X.Y.Z-M tag, branches exist,
#                       they merge into main cleanly and bring no upstream commit that main does not
#                       have (sync/... branches with fresh upstream code never get the key);
#                       their code in main is exactly one of their releases without the pre-release
#                       mark, published at least 7 days ago (ТЗ 3.6; hold=0 skips both, urgent
#                       candidate only by the owner's word);
#   candidate-build     environment rus-signing (manual approval, branch main only): our key from the
#                       environment secrets, in a temp dir outside the repo, deleted; no Gradle cache,
#                       no daemon, no configuration cache (as upstream signed-build.yml); checks with
#                       --mode release (our certificate) and update-manifest.json;
#   publish             switched off (repository variable RUS_PUBLISH_RELEASES != 'true'): GitHub
#                       release for a candidate of main alone, normal and latest (the in-app updater
#                       skips drafts and pre-releases). Kept ready for when releases are wanted.
# Tags rus-X.Y.Z-N are set by hand on main after the owner's "ok"; they build nothing.
name: RUS build
# Candidate runs carry their number and block branches in the run name: rus-remind.yml reads them.
# Other runs get GitHub's default name (a run-name of only whitespace falls back to it).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release != '0' &&
  format('RUS candidate {0} blocks: {1}{2}', inputs.release, inputs.blocks || '-', inputs.hold == '0' && ' (hold=0)' || '') || ' ' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: '0 = test build (one-time key); 1..99 = candidate with our key (must be above every rus-X.Y.Z-N tag)'
        required: true
        default: '0'
      blocks:
        description: 'candidate only: block branches merged onto main, space-separated (empty = main alone)'
        required: false
        default: ''
      hold:
        description: 'candidate only: 1 = their code in main must be their release, 7+ days old; 0 = urgent, only by the owner word'
        required: false
        default: '1'
  push:
    branches: [main, 'feature/**']
    # a push of .md files only builds nothing (owner's word 15.11; its PR gets the light RUS sync check)
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  # manual runs: a group of their own, so a candidate waiting for approval never holds or cancels another run
  group: rus-build-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test-build:
    name: rus test build (one-time key, -rus0)
    if: >-
      github.repository == 'lbarmen/JugglucoNG-RUS' &&
      (github.event_name == 'push' || inputs.release == '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # .gitmodules stays upstream's; our copy is used only when upstream's libjuice is unreachable.
      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the "upstream files untouched" check)
        run: |
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script, versions from Common/build.gradle)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      - name: Build rus phone + wear with a one-time signing key
        run: |
          set -euo pipefail
          umask 077
          kdir=$(mktemp -d "$RUNNER_TEMP/rus-onetime.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$kdir/onetime.p12" -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias onetime -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=JugglucoNG-RUS one-time test key" > /dev/null 2>&1
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/onetime.p12"
          export ORG_GRADLE_PROJECT_thepassword="$pw"
          export ORG_GRADLE_PROJECT_thekeyalias=onetime
          export ORG_GRADLE_PROJECT_thekeypassword="$pw"
          # phone and wear in separate calls: wear needs final R ids (see rus/gradlew-rus.sh)
          bash rus/gradlew-rus.sh :Common:assembleMobileRus \
            -PrusRelease=0 --no-daemon --no-configuration-cache --stacktrace
          bash rus/gradlew-rus.sh :Common:assembleWearRus \
            -PrusRelease=0 --no-daemon --no-configuration-cache --stacktrace

      - name: Checks on the APKs
        run: |
          set -euo pipefail
          phone=$(ls Common/build/outputs/apk/mobile/rus/*.apk)
          wear=$(ls Common/build/outputs/apk/wear/rus/*.apk)
          echo "phone: $phone"; echo "wear: $wear"
          python3 rus/check-apk.py --phone "$phone" --wear "$wear" --release 0 --mode test | tee rus-checks.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rus-test-${{ github.sha }}
          path: |
            Common/build/outputs/apk/mobile/rus/*.apk
            Common/build/outputs/apk/wear/rus/*.apk
            rus-checks.txt
          if-no-files-found: warn
          retention-days: 14

  candidate-precheck:
    name: rus candidate precheck (inputs, branches, no new upstream code)
    if: >-
      github.repository == 'lbarmen/JugglucoNG-RUS' && github.event_name == 'workflow_dispatch' &&
      inputs.release != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      blocks: ${{ steps.check.outputs.blocks }}
      pins: ${{ steps.check.outputs.pins }}
      tree: ${{ steps.check.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: Release number, block branches, merge onto main, upstream code = main's
        env:
          REL: ${{ inputs.release }}
          BLOCKS: ${{ inputs.blocks }}
          HOLD: ${{ inputs.hold }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the candidate on main (Use workflow from: main)"; exit 1; }
          [[ "$REL" =~ ^[1-9][0-9]?$ ]] || { echo "::error::release '$REL' is not 1..99"; exit 1; }
          up=$(sed -n "s/.*appVersionName *= *'\([^']*\)'.*/\1/p" Common/build.gradle | head -1)
          ver="${up%%-*}"
          git fetch --no-tags origin "+refs/tags/rus-*:refs/tags/rus-*" || true
          max=0
          for t in $(git tag -l "rus-$ver-*"); do
            m="${t##*-}"; [[ "$m" =~ ^[0-9]+$ ]] && [ "$m" -gt "$max" ] && max="$m"
          done
          [ "$REL" -gt "$max" ] || { echo "::error::release $REL must be above the last tag rus-$ver-$max"; exit 1; }
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main
          list=""; pins=""
          for b in $BLOCKS; do
            [[ "$b" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::branch name '$b' has odd characters"; exit 1; }
            case "$b" in main|upstream|upstream/*|sync/*) echo "::error::'$b' is not a block branch"; exit 1;; esac
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" || {
              echo "::error::branch '$b' is not on GitHub"; exit 1; }
            git -c user.name=rus-candidate -c user.email=rus-candidate@users.noreply.github.com \
              merge --no-ff --no-edit "origin/$b" || { echo "::error::'$b' does not merge cleanly onto main + earlier blocks"; exit 1; }
            list="$list $b"; pins="${pins:-} $b@$(git rev-parse "origin/$b")"
          done
          all=$(git rev-list --count HEAD "^$GITHUB_SHA")
          ours=$(git rev-list --count HEAD "^$GITHUB_SHA" ^upstream/main)
          [ "$all" = "$ours" ] || {
            echo "::error::the block branches bring $((all - ours)) upstream commit(s) that main does not have"; exit 1; }
          # ТЗ 3.6: their code in main = one of their releases (no pre-release mark), 7+ days old
          case "${HOLD:-1}" in
            0) echo "::warning::hold=0: release and 7-day checks skipped (urgent candidate, owner's word)" ;;
            1)
              theirs=$(git merge-base "$GITHUB_SHA" upstream/main)
              tags=$(git ls-remote --tags upstream | awk -v c="$theirs" '
                { n=$2; sub("refs/tags/","",n); p=sub(/\^\{\}$/,"",n); if (p || !(n in m)) m[n]=$1 }
                END { for (n in m) if (m[n]==c) print n }')
              rels=$(gh api "repos/ctqvva/JugglucoNG/releases?per_page=100" --jq \
                '.[] | select(.draft | not) | select(.prerelease | not) | "\(.tag_name) \(.published_at)"')
              # several of their releases on this commit -> the oldest one (same code, public since then)
              match=$(for t in $tags; do printf '%s\n' "$rels" | awk -v t="$t" '$1==t'; done | sort -k2 | head -1)
              [ -n "$match" ] || {
                echo "::error::their code in main (${theirs:0:9}) is not one of their releases without the pre-release mark (tags there: ${tags:-none}); merge a release first (rus/SYNC.md) or hold=0 by the owner's word"; exit 1; }
              # a tag moved onto a newer commit counts from that commit, not from the release date
              t_pub=$(date -d "${match#* }" +%s); t_commit=$(git show -s --format=%ct "$theirs")
              age=$(( ( $(date +%s) - (t_pub > t_commit ? t_pub : t_commit) ) / 86400 ))
              [ "$age" -ge 7 ] || {
                echo "::error::their release ${match%% *} is $age day(s) old; a candidate for the phone waits 7 days (ТЗ 3.6) or hold=0 by the owner's word"; exit 1; }
              echo "OK: their code in main = their release ${match%% *}, $age days old" ;;
            *) echo "::error::hold '$HOLD' is not 0 or 1"; exit 1 ;;
          esac
          echo "OK: candidate $ver-$REL = main ${GITHUB_SHA:0:7} +${list:- (no blocks)}; $all own commit(s) on top"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "blocks=${list# }" >> "$GITHUB_OUTPUT"
          echo "pins=${pins# }" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  candidate-build:
    name: rus candidate build with our key (environment rus-signing)
    needs: candidate-precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: rus-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # exactly the commits the precheck checked: a branch moved while the run waited for approval -> stop
      - name: Merge the block branches onto main (the commits and the tree the precheck checked)
        env:
          PINS: ${{ needs.candidate-precheck.outputs.pins }}
          TREE: ${{ needs.candidate-precheck.outputs.tree }}
        run: |
          set -euo pipefail
          for p in $PINS; do
            b="${p%@*}"; sha="${p##*@}"
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b"
            [ "$(git rev-parse "origin/$b")" = "$sha" ] || {
              echo "::error::branch '$b' moved after the precheck (${sha:0:9} -> $(git rev-parse --short "origin/$b")): run the candidate again"; exit 1; }
            git -c user.name=rus-candidate -c user.email=rus-candidate@users.noreply.github.com \
              merge --no-ff --no-edit "origin/$b"
          done
          [ "$(git rev-parse 'HEAD^{tree}')" = "$TREE" ] || { echo "::error::the tree differs from the one the precheck checked"; exit 1; }
          git log --oneline -1

      - name: libjuice submodule (upstream, our copy as fallback)
        run: |
          git submodule update --init --recursive || {
            echo "::warning::upstream libjuice unreachable, using lbarmen/libjuice"
            git config submodule.Common/src/main/cpp/libjuice.url https://github.com/lbarmen/libjuice.git
            git submodule update --init --recursive
          }

      - name: Fetch upstream main (for the "upstream files untouched" check)
        run: |
          git remote add upstream https://github.com/ctqvva/JugglucoNG.git
          git fetch --no-tags upstream main

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake (upstream script, versions from Common/build.gradle)
        run: bash scripts/dist/install-sdk.sh

      - name: Restore vendor libraries from upstream APK 1.2.3 (upstream script, sha256-checked)
        run: bash scripts/restore-build-inputs.sh

      # No Gradle cache: configuration caches may contain signing properties.
      # The key exists only inside this step, outside the repository and the artifacts.
      - name: Build rus phone + wear with our key
        env:
          RELEASE: ${{ needs.candidate-precheck.outputs.release }}
          KEYSTORE_BASE64: ${{ secrets.RUS_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_thepassword: ${{ secrets.RUS_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_thekeyalias: ${{ secrets.RUS_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_thekeypassword: ${{ secrets.RUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ORG_GRADLE_PROJECT_thepassword" ] || \
             [ -z "$ORG_GRADLE_PROJECT_thekeyalias" ] || [ -z "$ORG_GRADLE_PROJECT_thekeypassword" ]; then
            echo "::error::rus-signing: one of the four RUS_ secrets is empty"; exit 1
          fi
          kdir=$(mktemp -d "$RUNNER_TEMP/rus-signing.XXXXXX")
          trap 'rm -rf "$kdir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$kdir/rus-release.jks"
          unset KEYSTORE_BASE64
          keytool -list -keystore "$kdir/rus-release.jks" -storepass:env ORG_GRADLE_PROJECT_thepassword \
            -alias "$ORG_GRADLE_PROJECT_thekeyalias" > /dev/null 2>&1 || {
            echo "::error::rus-signing: key file, store password and alias do not fit together"; exit 1; }
          export ORG_GRADLE_PROJECT_thekeyfile="$kdir/rus-release.jks"
          # phone and wear in separate calls: wear needs final R ids (see rus/gradlew-rus.sh)
          bash rus/gradlew-rus.sh :Common:assembleMobileRus \
            -PrusRelease="$RELEASE" --no-daemon --no-configuration-cache --stacktrace
          bash rus/gradlew-rus.sh :Common:assembleWearRus \
            -PrusRelease="$RELEASE" --no-daemon --no-configuration-cache --stacktrace

      - name: Candidate files, update-manifest.json, checks (our certificate)
        env:
          RELEASE: ${{ needs.candidate-precheck.outputs.release }}
          VERSION: ${{ needs.candidate-precheck.outputs.version }}
          BLOCKS: ${{ needs.candidate-precheck.outputs.blocks }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          phones=(Common/build/outputs/apk/mobile/rus/*.apk); wears=(Common/build/outputs/apk/wear/rus/*.apk)
          [ ${#phones[@]} = 1 ] && [ ${#wears[@]} = 1 ] || {
            echo "::error::expected one phone and one wear APK: ${phones[*]} / ${wears[*]}"; exit 1; }
          mkdir dist
          phone="dist/JugglucoNG-RUS-$VERSION-$RELEASE.apk"
          wear="dist/JugglucoNG-RUS-$VERSION-$RELEASE-wear.apk"
          cp "${phones[0]}" "$phone"
          cp "${wears[0]}" "$wear"
          python3 rus/make-update-manifest.py --phone "$phone" > dist/update-manifest.json
          python3 rus/check-apk.py --phone "$phone" --wear "$wear" --release "$RELEASE" --mode release \
            --manifest dist/update-manifest.json | tee rus-checks.txt
          {
            echo "candidate $VERSION-$RELEASE"
            echo "main:   $GITHUB_SHA"
            echo "blocks: ${BLOCKS:-(none)}"
            echo "built:  $(git rev-parse HEAD)"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "cert:   $(tr -d '[:space:]' < rus/rus-cert.sha256)"
            (cd dist && sha256sum *)
          } | tee dist/candidate.txt
          up=$(sed -n "s/.*appVersionName *= *'\([^']*\)'.*/\1/p" Common/build.gradle | head -1)
          sed -e "s|@UPSTREAM@|$up|g" -e "s|@SHA@|$GITHUB_SHA|g" \
              -e "s|@CERT@|$(tr -d '[:space:]' < rus/rus-cert.sha256)|g" \
              -e "s|@PHONE@|$(basename "$phone")|g" -e "s|@WEAR@|$(basename "$wear")|g" \
              rus/release-notes.md > release-notes.md
          echo "Candidate **$VERSION-$RELEASE** (main ${GITHUB_SHA:0:7}, blocks: ${BLOCKS:-none}): APKs in this run's Artifacts (14 days)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rus-candidate-${{ needs.candidate-precheck.outputs.version }}-${{ needs.candidate-precheck.outputs.release }}
          path: |
            dist/
            release-notes.md
            rus-checks.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub release (switched off, no key)
    needs: [candidate-precheck, candidate-build]
    if: vars.RUS_PUBLISH_RELEASES == 'true' && needs.candidate-precheck.outputs.blocks == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rus-candidate-${{ needs.candidate-precheck.outputs.version }}-${{ needs.candidate-precheck.outputs.release }}
          path: rel

      - name: Create the release (normal, latest) and check it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: rus-${{ needs.candidate-precheck.outputs.version }}-${{ needs.candidate-precheck.outputs.release }}
        run: |
          set -euo pipefail
          cd rel
          ls -l dist
          gh release create "$TAG" dist/*.apk dist/update-manifest.json --target "$GITHUB_SHA" \
            --title "JugglucoNG RUS ${TAG#rus-}" --notes-file release-notes.md --latest
          state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "::error::release $TAG is draft/pre-release: $state"; exit 1; }
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          [ "$latest" = "$TAG" ] || { echo "::error::latest release is $latest, not $TAG"; exit 1; }
          n=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$n" = 3 ] || { echo "::error::release has $n assets, expected 3"; exit 1; }
          echo "Release **$TAG** published: normal, latest, 3 assets." >> "$GITHUB_STEP_SUMMARY"
